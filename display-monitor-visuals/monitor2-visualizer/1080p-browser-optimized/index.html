<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summit 2026 — Placard to Motion (system flow)</title>
    <style>
      :root {
        --bg0: #06080f;
        --bg1: #0c1020;
        --panel: rgba(18, 24, 42, 0.78);
        --border: rgba(100, 140, 200, 0.25);
        --text: #e8edf7;
        --muted: #8a96b0;
        --accent: #38bdf8;
        --accent2: #a78bfa;
        --ok: #34d399;
        --warn: #fbbf24;
        --v12: #f97316;
        --v5: #22d3ee;
        --iona: #d946ef;
        --hmi: #3b82f6;
        --psu: #1d4ed8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg0);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .stage {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: clamp(8px, 1.2vh, 18px) clamp(14px, 2.5vw, 36px);
        position: relative;
        isolation: isolate;
        background: radial-gradient(
            120% 85% at 50% 0%,
            rgba(30, 50, 100, 0.4) 0%,
            transparent 58%
          ),
          linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background: radial-gradient(
          120% 85% at 50% 0%,
          rgba(45, 75, 140, 0.22) 0%,
          transparent 55%
        );
        opacity: 0.55;
        animation: bgpulse 22s ease-in-out infinite alternate;
      }

      .stage > * {
        position: relative;
        z-index: 1;
      }

      @keyframes bgpulse {
        0%,
        100% {
          opacity: 0.42;
        }
        50% {
          opacity: 0.72;
        }
      }

      .page-hero {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: clamp(14px, 2.2vw, 24px);
        width: 100%;
        max-width: 1800px;
        box-sizing: border-box;
        margin: 0 0 clamp(6px, 0.8vh, 12px) 0;
        padding: 0 0 clamp(8px, 1vh, 12px) 0;
        border-bottom: 1px solid rgba(100, 140, 200, 0.12);
        align-self: stretch;
      }

      .page-hero .summit-logo {
        display: block;
        height: clamp(40px, 4.5vh, 58px);
        width: auto;
        flex-shrink: 0;
        object-fit: contain;
        border-radius: 4px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.35);
      }

      .byline-block {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.2em;
        min-width: min(100%, 280px);
        text-align: left;
      }

      .byline-block .eyebrow {
        margin: 0;
        font-size: clamp(0.68rem, 0.9vw, 0.8rem);
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(200, 210, 230, 0.55);
      }

      .byline-block .tagline {
        margin: 0;
        font-size: clamp(0.95rem, 1.55vw, 1.2rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.25;
        color: #f1f5f9;
        text-shadow: 0 0 32px rgba(15, 23, 42, 0.6);
      }

      @media (max-width: 520px) {
        .page-hero {
          flex-direction: column;
          align-items: flex-start;
        }
        .byline-block {
          text-align: left;
        }
      }

      .header {
        text-align: center;
        max-width: 1240px;
        /* sit the flow title lower under the logo row, nearer the Field stack */
        margin-top: clamp(1.5rem, 3.2vh, 2.75rem);
        margin-bottom: clamp(4px, 0.8vh, 10px);
        padding-top: clamp(0.35rem, 0.8vh, 0.75rem);
        padding-bottom: clamp(0.75rem, 1.1rem, 1.2rem);
        box-sizing: content-box;
      }

      .header h1 {
        font-size: clamp(1.3rem, 2.2vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
        line-height: 1.2;
        background: linear-gradient(120deg, #f8fafc 0%, #8b9cb8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .svg-wrap {
        /* ~1080p: use most of the 1920× content width, tall enough to read on ~1000px-tall viewports */
        width: min(100vw - 1.5rem, 1800px);
        max-width: 1800px;
        min-height: min(58vh, 620px);
        position: relative;
        margin: 0 auto;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        margin-bottom: 0.4rem;
      }

      .svg-wrap svg {
        width: 100%;
        height: auto;
        display: block;
        min-width: 1180px;
        max-width: 100%;
      }

      .node .card,
      .node rect {
        fill: var(--panel);
        stroke: var(--border);
        stroke-width: 1.2;
      }

      .node .title {
        font-size: 14px;
        font-weight: 600;
        fill: var(--text);
      }

      .node .sub {
        font-size: 10.5px;
        fill: var(--muted);
      }

      .cluster .outline {
        fill: rgba(20, 28, 50, 0.5);
        stroke: rgba(167, 139, 250, 0.4);
        stroke-width: 1.2;
        stroke-dasharray: 5 4;
        animation: cshift 18s linear infinite;
      }

      @keyframes cshift {
        to {
          stroke-dashoffset: -40;
        }
      }

      /* Soft wide stroke under the main spine (no blur filter — cheaper compositing). */
      .line-data-aura {
        fill: none;
        stroke: var(--accent);
        stroke-width: 1.3;
        stroke-linecap: round;
        stroke-opacity: 0.2;
        pointer-events: none;
      }

      .line-data {
        fill: none;
        stroke: var(--accent);
        stroke-width: 0.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-miterlimit: 8;
        opacity: 0.9;
      }

      .line-mq {
        fill: none;
        stroke: var(--accent2);
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 8 7;
        opacity: 0.9;
        animation: mqflow 1.6s linear infinite;
      }

      @keyframes mqflow {
        to {
          stroke-dashoffset: -15;
        }
      }

      .line-edgemgr {
        fill: none;
        stroke: rgba(220, 38, 38, 0.9);
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 8 7;
        opacity: 0.95;
        animation: mqflow 2s linear infinite;
      }

      .line-power-12 {
        fill: none;
        stroke: var(--v12);
        stroke-width: 2.2;
        stroke-linecap: round;
        opacity: 0.9;
        stroke-dasharray: 0.1 6;
        animation: power12 1.15s linear infinite;
      }

      @keyframes power12 {
        to {
          stroke-dashoffset: -6;
        }
      }

      .line-power-5 {
        fill: none;
        stroke: var(--v5);
        stroke-width: 1.7;
        stroke-linecap: round;
        opacity: 0.9;
        stroke-dasharray: 3 4;
        animation: p5 1s linear infinite;
      }

      @keyframes p5 {
        to {
          stroke-dashoffset: -7;
        }
      }

      .flow-dot {
        pointer-events: none;
      }

      .leaders {
        font-size: 10.5px;
        fill: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .legends {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 20px;
        margin-top: 0;
        max-width: 1200px;
        font-size: 12.5px;
        color: var(--muted);
        font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", monospace;
        letter-spacing: 0.02em;
      }

      .legends span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-break {
        flex-basis: 100%;
        height: 0;
      }

      .swatch {
        width: 20px;
        height: 4px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .s-data {
        background: linear-gradient(90deg, var(--accent), #7dd3fc);
      }
      .s-mq {
        background: linear-gradient(90deg, var(--accent2), #c4b5fd);
      }
      .s-12 {
        background: linear-gradient(90deg, var(--v12), #fdba74);
      }
      .s-5 {
        background: linear-gradient(90deg, var(--v5), #67e8f9);
      }
      .s-edgemgr {
        background: linear-gradient(90deg, rgba(220, 38, 38, 0.95), #f87171);
      }

      @media (min-width: 2400px) {
        .page-hero .summit-logo {
          height: clamp(56px, 6.5vh, 96px);
        }
        .byline-block .eyebrow {
          font-size: clamp(0.78rem, 1.05vw, 1.05rem);
        }
        .byline-block .tagline {
          font-size: clamp(1.08rem, 1.85vw, 1.85rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .line-mq,
        .line-edgemgr,
        .line-power-12,
        .line-power-5,
        .cluster .outline,
        .stage::before {
          animation: none !important;
        }
        .stage::before {
          opacity: 0.5 !important;
        }
        .line-mq,
        .line-edgemgr {
          stroke-dasharray: 8 0;
        }
        .line-power-12,
        .line-power-5 {
          stroke-dasharray: none;
        }
        .flow-dot {
          display: none;
        }
        #model-train {
          visibility: hidden;
        }
        #model-train-scene > ellipse {
          stroke-opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="page-hero">
        <img
          class="summit-logo"
          src="red-hat-summit-logo.png"
          width="200"
          height="70"
          alt="Red Hat Summit"
        />
        <div class="byline-block">
          <p class="eyebrow">Summit 2026</p>
          <p class="tagline">From Vision to Action at the Edge</p>
        </div>
      </div>
      <div class="header">
        <h1>Placard → Inference → Message bus → Edge control → Motion</h1>
      </div>

      <div
        class="svg-wrap"
        role="img"
        aria-label="Animated flow: camera, edge inference, field stack with ACP, MQ to broker and top of Site, Edge Manager to edge inference and deterministic IONA, Arduino, L298N, model train. 5V logic and 12V load paths."
      >
        <svg id="flow-svg" viewBox="0 0 1300 540" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="rack-led" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.35" />
              <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.95" />
              <stop offset="1" stop-color="#0ea5e9" stop-opacity="0.35" />
            </linearGradient>
            <!-- MQ bottom center (758,156) to Site top center (562,224) -->
            <path
              id="p-mq"
              d="M 758,156
                 L 758,188
                 L 562,188
                 L 562,224"
            />
            <!-- 12V: L298N bottom (y=340) → track -->
            <path id="p-p12" d="M 1090,340 L 1090,440 L 1040,440" />
            <path
              id="p-train-oval"
              d="M 1040,440 a 50,25,0,1,0,100,0 a 50,25,0,1,0,-100,0"
            />
            <!-- 5V: starts at left edge of placard (x=126), to Arduino on spine -->
            <path id="p-p5" d="M 126,350 L 914,350 L 914,282" />
            <!-- Edge Manager: each path runs full length from box bottom (878,156) to target top -->
            <path id="p-em-inference" d="M 878,156 L 878,200 L 386,200 L 386,224" />
            <path id="p-em-determined" d="M 878,156 L 878,200 L 738,200 L 738,224" />
          </defs>

          <path
            class="line-data-aura"
            d="M 126,282
               L 1174,282"
            aria-hidden="true"
          />
          <path
            id="p-main"
            class="line-data"
            d="M 126,282
               L 1174,282"
          />
          <use href="#p-mq" class="line-mq" />
          <use href="#p-p12" class="line-power-12" />
          <use href="#p-p5" class="line-power-5" />
          <use href="#p-em-inference" class="line-edgemgr" />
          <use href="#p-em-determined" class="line-edgemgr" />

          <!-- Field stack: ACP, MiniRack, OpenShift, MQ, Edge Manager; #p-em-* from EM to Edge inference + Deterministic -->
          <g class="cluster" transform="translate(310, 6)">
            <rect class="outline" x="0" y="0" width="680" height="210" rx="10" />
            <text
              x="12"
              y="20"
              font-size="11"
              fill="var(--muted)"
              font-weight="600"
              letter-spacing="0.1em"
              text-transform="uppercase"
            >Field stack</text>
            <text
              x="12"
              y="38"
              fill="var(--accent2)"
              font-size="12.5"
              font-weight="700"
            >
              Red Hat · Advanced Compute Platform (AirGap Pattern)
            </text>
            <g id="mini-rack" transform="translate(12, 52)">
              <!-- 200×120; label and IONA tight to top; inner 192 = 95+2+95 -->
              <rect
                x="0"
                y="0"
                width="200"
                height="120"
                rx="5"
                fill="rgba(6, 10, 20, 0.55)"
                stroke="rgba(100, 140, 200, 0.28)"
              />
              <text
                x="4"
                y="12"
                font-size="7.5"
                fill="var(--muted)"
                font-weight="600"
              >MiniRack</text>
              <rect
                x="4"
                y="18"
                width="192"
                height="16"
                rx="2.5"
                fill="rgba(35, 12, 32, 0.65)"
                stroke="var(--iona)"
                stroke-width="1.1"
              />
              <text x="8" y="29" font-size="7" font-weight="700" fill="#f5d0fe">Tyrrell IONA PLC (field I/O)</text>
              <rect
                x="4"
                y="35"
                width="192"
                height="10"
                rx="2.5"
                fill="rgba(20, 40, 80, 0.55)"
                stroke="rgba(59, 130, 246, 0.45)"
              />
              <text x="8" y="42" font-size="6.2" fill="var(--warn)">HMI panel (browser / app)</text>
              <rect
                x="4"
                y="47"
                width="95"
                height="10"
                rx="2"
                fill="rgba(55, 60, 65, 0.8)"
                stroke="var(--border)"
              />
              <text
                x="51.5"
                y="52"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="6"
                fill="var(--text)"
              >Stratix 5200 Switch</text>
              <rect
                x="101"
                y="47"
                width="95"
                height="10"
                rx="2"
                fill="rgba(20, 35, 50, 0.8)"
                stroke="rgba(56, 189, 248, 0.4)"
              />
              <text
                x="148.5"
                y="52"
                text-anchor="middle"
                dominant-baseline="middle"
                font-size="6"
                fill="var(--v5)"
              >Advantech UNO-148</text>
              <rect
                x="4"
                y="60"
                width="47"
                height="30"
                rx="2"
                fill="rgba(20, 22, 30, 0.9)"
                stroke="rgba(239, 68, 68, 0.45)"
                stroke-width="0.8"
              />
              <text
                x="27.5"
                y="78"
                text-anchor="middle"
                font-size="6"
                font-weight="700"
                fill="var(--text)"
              >Node 0</text>
              <rect
                x="52"
                y="60"
                width="47"
                height="30"
                rx="2"
                fill="rgba(20, 22, 30, 0.9)"
                stroke="rgba(239, 68, 68, 0.45)"
                stroke-width="0.8"
              />
              <text
                x="75.5"
                y="78"
                text-anchor="middle"
                font-size="6"
                font-weight="700"
                fill="var(--text)"
              >Node 1</text>
              <rect
                x="101"
                y="60"
                width="95"
                height="30"
                rx="2.5"
                fill="rgba(25, 28, 40, 0.92)"
                stroke="rgba(239, 68, 68, 0.45)"
                stroke-width="0.8"
              />
              <text
                x="148.5"
                y="78"
                text-anchor="middle"
                font-size="6"
                font-weight="700"
                fill="var(--text)"
              >Arbiter</text>
              <rect
                x="0"
                y="114.5"
                width="200"
                height="3.5"
                fill="url(#rack-led)"
              />
            </g>
            <text
              x="220"
              y="60"
              font-size="8.5"
              font-weight="600"
              fill="var(--text)"
            >OpenShift: Two Node + Arbiter Cluster</text>
            <text x="220" y="76" font-size="7.5" fill="var(--muted)">Cluster API, images</text>
            <text x="220" y="92" font-size="7.2" fill="var(--muted)">Advantech UNO-148 bootstrap</text>
            <text x="220" y="107" font-size="7" fill="var(--muted)">Services: <tspan fill="var(--v5)">NAT</tspan> - <tspan fill="var(--v5)">DNS</tspan> - <tspan fill="var(--v5)">DHCP</tspan></text>
            <text x="220" y="123" font-size="7" fill="var(--muted)">Node 0: SimplyNUC EE-2200</text>
            <text x="220" y="138" font-size="7" fill="var(--muted)">Node 1: SimplyNUC EE-2200</text>
            <text x="220" y="153" font-size="7" fill="var(--muted)">Arbiter: SimplyNUC EE-1100</text>
            <rect
              x="400"
              y="50"
              width="96"
              height="100"
              rx="8"
              fill="rgba(10, 18, 40, 0.9)"
              stroke="rgba(167, 139, 250, 0.6)"
            />
            <text
              x="448"
              y="86"
              text-anchor="middle"
              font-size="11.5"
              font-weight="700"
              fill="var(--text)"
            >MQ</text>
            <text
              x="448"
              y="102"
              text-anchor="middle"
              font-size="5.5"
              fill="var(--muted)"
            >Message Broker</text>
            <rect
              x="520"
              y="50"
              width="96"
              height="100"
              rx="8"
              fill="rgba(10, 18, 40, 0.9)"
              stroke="rgba(220, 38, 38, 0.7)"
            />
            <text
              x="568"
              y="86"
              text-anchor="middle"
              font-size="11.5"
              font-weight="700"
              fill="var(--text)"
            >Edge Manager</text>
            <text
              x="568"
              y="102"
              text-anchor="middle"
              font-size="5.5"
              fill="var(--muted)"
            >Device Management</text>
          </g>

          <text class="leaders" x="200" y="365">5V supply - logic / MCU</text>

          <g class="node" transform="translate(126, 224)">
            <rect class="card" x="0" y="0" width="168" height="116" rx="8" />
            <text x="12" y="24" class="title">Placard camera</text>
            <text x="12" y="40" class="sub">Logitech Webcam</text>
            <text x="12" y="58" class="sub">Live frames in</text>
          </g>
          <g class="node" transform="translate(302, 224)">
            <rect class="card" x="0" y="0" width="168" height="116" rx="8" />
            <text x="12" y="24" class="title">Edge inference</text>
            <text x="12" y="40" class="sub">SimplyNUC EE-2200</text>
            <text x="12" y="56" class="sub">CV container</text>
            <text x="12" y="80" class="sub" fill="var(--ok)">placard classes</text>
          </g>
          <g class="node" transform="translate(478, 224)">
            <rect class="card" x="0" y="0" width="168" height="116" rx="8" />
            <text x="12" y="24" class="title">Site network</text>
            <text x="12" y="40" class="sub">Stratix 5200 Switch</text>
            <text x="12" y="60" class="sub">L2 / industrial Ethernet</text>
          </g>
          <g class="node" transform="translate(654, 224)">
            <rect class="card" x="0" y="0" width="168" height="116" rx="8" />
            <text x="12" y="24" class="title">Deterministic edge</text>
            <text x="12" y="42" class="sub">Tyrrell IONA (PLC)</text>
            <text x="12" y="64" class="sub">message → field</text>
            <text x="12" y="86" class="sub">timing / OT bridge</text>
          </g>
          <g class="node" transform="translate(830, 224)">
            <rect class="card" x="0" y="0" width="168" height="116" rx="8" />
            <text x="12" y="24" class="title">Microcontroller</text>
            <text x="12" y="40" class="sub">Arduino Uno</text>
            <text x="12" y="60" class="sub">PWM &amp; direction</text>
            <text x="12" y="80" class="sub" fill="var(--v5)">5V I/O</text>
          </g>
          <g class="node" transform="translate(1006, 224)">
            <rect
              x="0"
              y="0"
              width="168"
              height="116"
              class="card"
              rx="8"
              style="fill: rgba(20, 28, 50, 0.68)"
            />
            <text x="12" y="24" class="title">Motor</text>
            <text x="12" y="40" class="sub">L298N Controller</text>
            <text x="12" y="60" class="sub">switches <tspan fill="var(--v12)">12V</tspan> → track</text>
          </g>

          <g id="model-train-scene">
            <ellipse
              id="train-track-oval"
              class="track-line"
              cx="1090"
              cy="440"
              rx="50"
              ry="25"
              fill="none"
              stroke="rgba(251, 191, 36, 0.45)"
              stroke-width="1.4"
              stroke-dasharray="2 3"
            />
            <g id="model-train" opacity="0">
              <g
                fill="#facc15"
                stroke="rgba(15, 23, 42, 0.5)"
                stroke-width="0.2"
                transform="translate(0,0) scale(1.15)"
              >
                <rect x="0" y="-2" width="8" height="3.5" rx="0.3" fill="#1e293b" />
                <rect x="1" y="-1" width="5" height="2" rx="0.2" fill="#facc15" />

    <script>
      (function () {
        var flowSvg = document.getElementById("flow-svg");
        function syncSvgPause() {
          if (!flowSvg || typeof flowSvg.pauseAnimations !== "function") return;
          if (document.hidden) flowSvg.pauseAnimations();
          else flowSvg.unpauseAnimations();
        }
        document.addEventListener("visibilitychange", syncSvgPause);
        syncSvgPause();

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var p12A = document.getElementById("p12-orb-anim");
        var trainA = document.getElementById("train-lap-anim");
        var p12c = document.getElementById("p12-orb");
        var trainG = document.getElementById("model-train");
        var ring = document.getElementById("train-track-oval");
        if (!p12A || !p12A.beginElement) return;
        var CYCLE_MS = 4800;
        var ORANGE_DUR = 750;
        var T_ORANGE_START = CYCLE_MS - ORANGE_DUR;

        function p12OnStart() {
          if (p12c) p12c.setAttribute("opacity", "1");
        }
        function p12OnEnd() {
          if (p12c) p12c.setAttribute("opacity", "0");
          if (document.visibilityState && document.visibilityState !== "visible") return;
          if (trainA && trainA.beginElement) trainA.beginElement();
        }
        p12A.addEventListener("beginEvent", p12OnStart);
        p12A.addEventListener("endEvent", p12OnEnd);

        function trainOnStart() {
          if (trainG) trainG.setAttribute("opacity", "1");
          if (ring) {
            ring.setAttribute("stroke", "rgba(52, 211, 153, 0.75)");
            ring.setAttribute("stroke-width", "2.2");
          }
        }
        function trainOnEnd() {
          if (trainG) trainG.setAttribute("opacity", "0");
          if (ring) {
            ring.setAttribute("stroke", "rgba(251, 191, 36, 0.45)");
            ring.setAttribute("stroke-width", "1.4");
          }
        }
        if (trainA) {
          trainA.addEventListener("beginEvent", trainOnStart);
          trainA.addEventListener("endEvent", trainOnEnd);
        }

        function startOrange() {
          if (document.visibilityState && document.visibilityState !== "visible") return;
          try {
            p12A.endElement();
          } catch (e) {
            void e;
          }
          p12A.beginElement();
        }
        // Orange arrives at track (bottom of 12V stub) as each 4.8s end-to-end cycle finishes; then train runs.
        setTimeout(function tick() {
          startOrange();
          setTimeout(tick, CYCLE_MS);
        }, T_ORANGE_START);
      })();
    </script>
